<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Management | Lumina Studio</title>
    <script src="https://unpkg.com/lucide@0.470.0"></script>
    <link rel="icon" type="image/png" href="../assets/img/favicons/favicon.png">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
        }

        .gallery-item {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            aspect-ratio: 1;
            background: var(--bg-main);
            border: 1px solid var(--border);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .item-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            opacity: 0;
            transition: var(--transition);
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="dashboard-sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="brand-area">
                    <div class="brand-icon">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </div>
                    <span class="brand-name">LUMINA STUDIO</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">Core</div>
                <a href="dashboard.html" class="nav-link">
                    <i data-lucide="layout-grid"></i>
                    <span>Overview</span>
                </a>
                <a href="users.html" class="nav-link">
                    <i data-lucide="users"></i>
                    <span>User Management</span>
                </a>

                <div class="nav-section-title">Content</div>
                <a href="blogs.html" class="nav-link">
                    <i data-lucide="file-text"></i>
                    <span>Blog Posts</span>
                </a>
                <a href="gallery.html" class="nav-link active">
                    <i data-lucide="image"></i>
                    <span>Gallery</span>
                </a>
                <a href="#" class="nav-link">
                    <i data-lucide="check-square"></i>
                    <span>Post Approval</span>
                </a>

                <div class="nav-section-title">Operations</div>
                <a href="bookings.html" class="nav-link">
                    <i data-lucide="calendar"></i>
                    <span>Bookings</span>
                </a>
                <a href="messages.html" class="nav-link">
                    <i data-lucide="mail"></i>
                    <span>Messages</span>
                </a>
                <a href="#" class="nav-link">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Analytics</span>
                </a>

                <div class="nav-section-title">System</div>
                <a href="#" class="nav-link">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer" style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05);">
                <button onclick="logout()" class="nav-link"
                    style="width: 100%; border: none; background: transparent; cursor: pointer;">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-title">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <button onclick="toggleSidebar()" class="icon-btn lg:hidden">
                            <i data-lucide="menu"></i>
                        </button>
                        <div>
                            <h1>Gallery Management</h1>
                            <p>Curate your studio portfolio and showcase</p>
                        </div>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="btn btn-primary">
                        <i data-lucide="upload"></i> Upload Images
                    </button>
                </div>
            </header>

            <div class="section-card">
                <div class="card-header">
                    <h2>Portfolio Assets</h2>
                    <div class="search-bar" style="position: relative;">
                        <i data-lucide="filter"
                            style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 14px;"></i>
                        <input type="text" placeholder="Filter by category..."
                            style="padding: 0.5rem 1rem 0.5rem 2.25rem; border-radius: 100px; border: 1px solid var(--border); width: 220px; font-size: 0.8rem;">
                    </div>
                </div>

                <div class="gallery-grid" id="gallery_grid">
                    <!-- Gallery items will be loaded here -->
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted);">
                        <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4"></i>
                        <p>Scanning portfolio vault...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/admin-gallery.js"></script>
    <script>
        lucide.createIcons();
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }
        function logout() {
            localStorage.clear();
            window.location.replace('../signin.html');
        }
    </script>
</body>

</html>
