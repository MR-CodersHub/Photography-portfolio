<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics & Reports | Lumina Studio</title>
    <script src="https://unpkg.com/lucide@0.470.0"></script>
    <link rel="icon" type="image/png" href="../assets/img/favicons/favicon.png">
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="dashboard-sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="brand-area">
                    <div class="brand-icon">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </div>
                    <span class="brand-name">LUMINA STUDIO</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">Core</div>
                <a href="dashboard.html" class="nav-link">
                    <i data-lucide="layout-grid"></i>
                    <span>Overview</span>
                </a>
                <a href="users.html" class="nav-link">
                    <i data-lucide="users"></i>
                    <span>User Management</span>
                </a>

                <div class="nav-section-title">Content</div>
                <a href="blogs.html" class="nav-link">
                    <i data-lucide="file-text"></i>
                    <span>Blog Posts</span>
                </a>
                <a href="gallery.html" class="nav-link">
                    <i data-lucide="image"></i>
                    <span>Gallery</span>
                </a>
                <a href="post-approval.html" class="nav-link">
                    <i data-lucide="check-square"></i>
                    <span>Post Approval</span>
                </a>

                <div class="nav-section-title">Operations</div>
                <a href="bookings.html" class="nav-link">
                    <i data-lucide="calendar"></i>
                    <span>Bookings</span>
                </a>
                <a href="messages.html" class="nav-link">
                    <i data-lucide="mail"></i>
                    <span>Messages</span>
                </a>
                <a href="analytics.html" class="nav-link active">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Analytics</span>
                </a>

                <div class="nav-section-title">System</div>
                <a href="settings.html" class="nav-link">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer" style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05);">
                <button onclick="logout()" class="nav-link"
                    style="width: 100%; border: none; background: transparent; cursor: pointer;">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-title">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <button onclick="toggleSidebar()" class="icon-btn lg:hidden">
                            <i data-lucide="menu"></i>
                        </button>
                        <div>
                            <h1>Analytics Center</h1>
                            <p>Studio performance and demographic metrics</p>
                        </div>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="btn btn-ghost">
                        <i data-lucide="calendar-days"></i> Last 30 Days
                    </button>
                    <button class="btn btn-primary">
                        <i data-lucide="download"></i> Generate Report
                    </button>
                </div>
            </header>

            <div class="dashboard-grid">
                <div class="section-card" style="grid-column: span 2;">
                    <div class="card-header">
                        <h2>Revenue Growth</h2>
                        <i data-lucide="more-horizontal" class="icon-btn" style="border: none;"></i>
                    </div>
                    <div style="padding: 2rem;">
                        <canvas id="revenueChart" height="200"></canvas>
                    </div>
                </div>

                <div class="section-card">
                    <div class="card-header">
                        <h2>Booking Distribution</h2>
                    </div>
                    <div style="padding: 2.5rem;">
                        <canvas id="bookingChart" height="300"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        function logout() {
            localStorage.clear();
            window.location.replace('../signin.html');
        }

        // Revenue Chart
        const revCtx = document.getElementById('revenueChart').getContext('2d');
        new Chart(revCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Income ($)',
                    data: [12000, 19000, 15000, 25000, 22000, 30000],
                    borderColor: '#f59e0b',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(245, 158, 11, 0.05)'
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f1f1' } },
                    x: { grid: { display: false } }
                }
            }
        });

        // Booking Distribution Chart
        const bookCtx = document.getElementById('bookingChart').getContext('2d');
        new Chart(bookCtx, {
            type: 'doughnut',
            data: {
                labels: ['Portrait', 'Wedding', 'Event', 'Fashion'],
                datasets: [{
                    data: [45, 25, 20, 10],
                    backgroundColor: ['#f59e0b', '#10b981', '#6366f1', '#ec4899'],
                    borderWidth: 0
                }]
            },
            options: {
                plugins: { legend: { position: 'bottom' } },
                cutout: '70%'
            }
        });
    </script>
</body>

</html>
