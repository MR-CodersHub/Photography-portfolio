<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Management | Lumina Studio</title>
    <script src="https://unpkg.com/lucide@0.470.0"></script>
    <link rel="icon" type="image/png" href="../assets/img/favicons/favicon.png">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="dashboard-sidebar">
            <div class="sidebar-header">
                <a href="../index.html" class="brand-area">
                    <div class="brand-icon">
                        <i data-lucide="camera" class="w-6 h-6"></i>
                    </div>
                    <span class="brand-name">LUMINA STUDIO</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-title">Core</div>
                <a href="dashboard.html" class="nav-link">
                    <i data-lucide="layout-grid"></i>
                    <span>Overview</span>
                </a>
                <a href="users.html" class="nav-link">
                    <i data-lucide="users"></i>
                    <span>User Management</span>
                </a>

                <div class="nav-section-title">Content</div>
                <a href="blogs.html" class="nav-link">
                    <i data-lucide="file-text"></i>
                    <span>Blog Posts</span>
                </a>
                <a href="gallery.html" class="nav-link">
                    <i data-lucide="image"></i>
                    <span>Gallery</span>
                </a>
                <a href="#" class="nav-link">
                    <i data-lucide="check-square"></i>
                    <span>Post Approval</span>
                </a>

                <div class="nav-section-title">Operations</div>
                <a href="bookings.html" class="nav-link active">
                    <i data-lucide="calendar"></i>
                    <span>Bookings</span>
                </a>
                <a href="messages.html" class="nav-link">
                    <i data-lucide="mail"></i>
                    <span>Messages</span>
                </a>
                <a href="#" class="nav-link">
                    <i data-lucide="bar-chart-3"></i>
                    <span>Analytics</span>
                </a>

                <div class="nav-section-title">System</div>
                <a href="#" class="nav-link">
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer" style="padding: 1.5rem; border-top: 1px solid rgba(255,255,255,0.05);">
                <button onclick="logout()" class="nav-link"
                    style="width: 100%; border: none; background: transparent; cursor: pointer;">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="toggleSidebar()"></div>

        <main class="main-content">
            <header class="dashboard-header">
                <div class="header-title">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <button onclick="toggleSidebar()" class="icon-btn lg:hidden">
                            <i data-lucide="menu"></i>
                        </button>
                        <div>
                            <h1>Booking Management</h1>
                            <p>Review and confirm studio photo sessions</p>
                        </div>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="btn btn-ghost">
                        <i data-lucide="download"></i> Export CSV
                    </button>
                </div>
            </header>

            <div class="section-card">
                <div class="card-header">
                    <h2>Session Schedule</h2>
                    <div class="search-bar" style="position: relative;">
                        <i data-lucide="calendar-range"
                            style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 14px;"></i>
                        <input type="text" placeholder="Session filter..."
                            style="padding: 0.5rem 1rem 0.5rem 2.25rem; border-radius: 100px; border: 1px solid var(--border); width: 220px; font-size: 0.8rem;">
                    </div>
                </div>
                <div class="table-wrapper">
                    <table class="modern-table">
                        <thead>
                            <tr class="bg-zinc-50/50">
                                <th class="p-6 text-[10px] font-black uppercase tracking-widest text-zinc-400">Date</th>
                                <th class="p-6 text-[10px] font-black uppercase tracking-widest text-zinc-400">Client
                                </th>
                                <th class="p-6 text-[10px] font-black uppercase tracking-widest text-zinc-400">Service
                                </th>
                                <th class="p-6 text-[10px] font-black uppercase tracking-widest text-zinc-400">Contact
                                </th>
                                <th class="p-6 text-[10px] font-black uppercase tracking-widest text-zinc-400">Message
                                </th>
                                <th class="p-6 text-[10px] font-black uppercase tracking-widest text-zinc-400">Status
                                </th>
                                <th class="p-6 text-[10px] font-black uppercase tracking-widest text-zinc-400">Action
                                </th>
                            </tr>
                        </thead>
                        <tbody id="bookings_table">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/admin-bookings.js"></script>
    <script>
        // Lucide icons initialization
        lucide.createIcons();

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar && overlay) {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
        }

        function handleNavClick() {
            if (window.innerWidth < 1024) {
                toggleSidebar();
            }
        }
    </script>
</body>

</html>
