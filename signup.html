<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Lumina Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.470.0"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/favicons/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <style>
        .signin-bg {
            background: linear-gradient(rgba(9, 9, 11, 0.9), rgba(9, 9, 11, 0.95)), url('assets/img/hero/main-hero.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .auth-card {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .animate-slow-zoom {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-zinc-950 text-white min-h-screen flex flex-col font-['Inter']">
    
    <!-- Grainy Overlay -->
    <div class="grainy-overlay"></div>

    <main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden signin-bg min-h-screen">
        <!-- Abstract Decorations -->
        <div class="absolute top-1/4 -left-20 w-64 h-64 bg-amber-500/10 rounded-full blur-[120px] pointer-events-none">
        </div>
        <div
            class="absolute bottom-1/4 -right-20 w-64 h-64 bg-zinc-500/10 rounded-full blur-[120px] pointer-events-none">
        </div>

        <!-- Create Profile Card -->
        <div class="auth-card w-full max-w-md p-8 md:p-10 rounded-3xl shadow-2xl relative z-10 border border-zinc-800 bg-zinc-950/80 backdrop-blur-xl animate-slow-zoom">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center space-x-3 mb-6 group">
                    <div class="bg-amber-500/10 p-2 rounded-xl border border-amber-500/20 group-hover:bg-amber-500 transition-all duration-500">
                        <i data-lucide="plus" class="w-6 h-6 text-amber-500 group-hover:text-black transition-colors"></i>
                    </div>
                    <span class="text-xl font-black uppercase tracking-tighter text-white">Lumina Studio</span>
                </a>
                <h2 class="text-3xl font-bold text-white mb-2">Create Profile</h2>
                <p class="text-zinc-400 text-sm leading-relaxed">Join our creative ecosystem for a personalized experience.</p>
            </div>

            <!-- Form -->
            <form id="signUpForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2 pl-1">Full Name</label>
                    <input type="text" id="name" required
                        class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-amber-500 focus:bg-zinc-900 transition-all placeholder:text-zinc-600"
                        placeholder="John Doe">
                </div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2 pl-1">Email Address</label>
                    <input type="email" id="email" required
                        class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl px-4 py-3.5 text-white focus:outline-none focus:border-amber-500 focus:bg-zinc-900 transition-all placeholder:text-zinc-600"
                        placeholder="name@email.com">
                </div>

                <div class="relative">
                    <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2 pl-1">Password</label>
                    <div class="relative">
                        <input type="password" id="password" required
                            class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl pl-4 pr-12 py-3.5 text-white focus:outline-none focus:border-amber-500 focus:bg-zinc-900 transition-all placeholder:text-zinc-600 tracking-widest"
                            placeholder="••••••••">
                        <button type="button" id="togglePassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white transition-colors focus:outline-none">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                
                <div class="relative">
                    <label class="block text-xs font-bold uppercase tracking-widest text-zinc-500 mb-2 pl-1">Verify</label>
                    <div class="relative">
                        <input type="password" id="verifyPassword" required
                            class="w-full bg-zinc-900/50 border border-zinc-800 rounded-xl pl-4 pr-12 py-3.5 text-white focus:outline-none focus:border-amber-500 focus:bg-zinc-900 transition-all placeholder:text-zinc-600 tracking-widest"
                            placeholder="••••••••">
                        <button type="button" id="toggleVerifyPassword" class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-white transition-colors focus:outline-none">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden bg-red-500/10 border border-red-500/20 text-red-500 text-sm p-3 rounded-lg text-center"></div>

                <button type="submit" 
                    class="w-full bg-amber-600 text-white font-bold text-sm uppercase tracking-widest py-4 rounded-xl hover:bg-amber-500 transition-all shadow-lg shadow-amber-500/10 flex items-center justify-center gap-2">
                    Create Account
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-zinc-500 text-sm">Already have a profile? <a href="signin.html" class="text-amber-500 font-bold hover:text-white transition-colors">Sign In</a></p>
            </div>

            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-zinc-800"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase tracking-widest">
                    <span class="px-4 bg-zinc-950 text-zinc-600">Social Enrollment</span>
                </div>
            </div>

            <button 
                class="w-full bg-white text-zinc-900 font-bold text-sm py-3.5 rounded-xl hover:bg-zinc-200 transition-all flex items-center justify-center gap-3">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Google
            </button>
        </div>
    </main>

    <script type="module" src="js/auth-signup.js"></script>
</body>

</html>
